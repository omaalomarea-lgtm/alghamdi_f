<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة حضور وانصراف المعلمات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- النموذج الخفي المضمون للإرسال من الجوالات -->
  <iframe name="post_frame" id="post_frame" style="display:none; width:0; height:0;"></iframe>
  <form id="attendanceForm" method="POST" action="https://script.google.com/macros/s/AKfycbxiUtk3-gtyAQEqGGvG2ZAKf4tUvF-IkuzN7K2zQ1t6hmsCxI_pgMlDjq0z-h3Czq59HA/exec" target="post_frame" style="display:none;">
    <input type="hidden" name="action" id="f_action">
    <input type="hidden" name="id" id="f_id">
    <input type="hidden" name="type" id="f_type">
    <input type="hidden" name="dev" id="f_dev">
  </form>

  <div>
    <!-- Header -->
    <header class="bg-teal-900 text-white shadow-md py-4 px-4 text-center">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-teal-800 rounded-xl">
            <svg class="w-6 h-6 text-teal-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <span class="font-bold text-base">بوابة الحضور والانصراف</span>
        </div>
        <span class="text-xs text-teal-200" id="clockBox"></span>
      </div>
    </header>

    <main class="max-w-md mx-auto p-4 mt-6">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-6 md:p-8">
        
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-teal-50 text-teal-700 rounded-2xl flex items-center justify-center mx-auto mb-3">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          <h2 class="text-2xl font-black text-slate-800">تسجيل الدوام اليومي</h2>
          <p class="text-xs text-slate-500 mt-1" id="subTitle">الرجاء إدخال رقم السجل المدني للربط بالجهاز</p>
        </div>

        <div id="boxInput" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهوية الوطنية</label>
            <input type="tel" id="inputId" maxlength="10" placeholder="10xxxxxxxx" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-teal-600 focus:outline-none text-center text-xl font-bold tracking-widest text-slate-800">
          </div>
          <button onclick="bindTeacher()" id="btnVerify" class="w-full py-4 bg-teal-700 hover:bg-teal-800 active:scale-95 text-white rounded-2xl font-bold shadow-lg shadow-teal-700/20 transition">
            ربط الجهاز وتسجيل
          </button>
          <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-center">
            <p class="text-[11px] text-amber-800 font-semibold leading-relaxed">
              🔒 تنبيه: سيتم قفل هذا الجوال على هويتك لمنع تحضير معلمات أخريات من نفس الجهاز.
            </p>
          </div>
        </div>

        <div id="boxAction" class="hidden space-y-4">
          <div class="bg-teal-50 border border-teal-200 rounded-2xl p-4 text-center">
            <span class="text-xs font-bold text-teal-600">أهلاً بك أستاذة</span>
            <h3 id="tName" class="text-lg font-black text-teal-950 mt-0.5"></h3>
            <p id="tId" class="text-xs text-teal-600 font-mono mt-0.5"></p>
            <span class="inline-block mt-2 px-2.5 py-0.5 bg-teal-100 text-teal-800 rounded-full text-[10px] font-bold">🔒 هذا الجهاز موثق لحسابك</span>
          </div>

          <div class="grid grid-cols-1 gap-3">
            <button onclick="recordTime('CHECK_IN')" id="btnIn" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-2xl font-bold shadow-md transition flex items-center justify-center gap-2">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
              <span>تسجيل حضور صباحي</span>
            </button>

            <button onclick="recordTime('CHECK_OUT')" id="btnOut" class="w-full py-4 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white rounded-2xl font-bold shadow-md transition flex items-center justify-center gap-2">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
              <span>تسجيل انصراف</span>
            </button>
          </div>

          <div id="msgBox" class="hidden p-3.5 rounded-xl text-xs font-bold text-center"></div>
        </div>

      </div>
    </main>
  </div>

  <footer class="py-4 bg-teal-950 text-white text-center border-t border-teal-800">
    <p class="text-xs text-teal-200">
      هذا الموقع من ابتكار وتصميم وكيلة المدرسة الأستاذة: <span class="text-teal-300 font-bold underline">فوزية عبدالله الغامدي</span>
    </p>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxiUtk3-gtyAQEqGGvG2ZAKf4tUvF-IkuzN7K2zQ1t6hmsCxI_pgMlDjq0z-h3Czq59HA/exec";

    const TEACHERS = {
      "1022369092": "صالحه نجدي مناحي البلوي", "1059648780": "هويدا منصور سعيد الصحفي",
      "1047002900": "هناء المدي خلف الرويلي", "1059924199": "فاديه عبدالعزيز مهنا الجهني",
      "1037037338": "مها قاسم محمد الرويلي", "1159663960": "حنان جابر محيلان الرويلي",
      "1010576831": "الفت رجاء دخيل الله الصعيدي", "1021167703": "عبير علي عواد العطوي",
      "1049056573": "مليحه سويد غانم الشراري", "1094291067": "ليالي مصلح مليح العازمي",
      "1078763156": "نجود خالد جمعه البغدادي", "1078451927": "غاليه عطالله اديلم الشراري",
      "1039434392": "فضيه دبيان حمدان الشرارى", "1068465911": "رشا سليمان شلاح العتيبي",
      "1050081528": "أريج هويمل سالم الحويطي", "1116712413": "مها عبدالحكيم محمد العنزي",
      "1046134183": "نشمية راضي محمد الشراري", "1065390724": "فاطمه مسفر سالم القحطاني",
      "1038482848": "بسمة مضحي شاقي العنزي", "1046234306": "علياء خليف براك الشراري",
      "1020723274": "تهاني سليمان محمد الشراري", "1028943767": "ولاء عبدالرزاق بن محمدبكر هوساوي",
      "1065210757": "بشاير بخيت عطيه السلمي", "1014740672": "البندري محمد خلف الشمري",
      "1064013350": "منيفة خلف عشوي العنزي", "1014392128": "مريم حسين عبدالله العازمي",
      "1051186144": "سعيده رضيمان فرج البلوي", "1064358995": "نوار حميد مريشد العوفي",
      "1022561953": "مها معاشي بن عبيدان العنزي", "1030634933": "دلال شرف عيضه السيالي",
      "1060888847": "منال سعيد بن ربيع الصاعدي"
    };

    function getUUID() {
      let d = localStorage.getItem('TEACHER_DEV_UUID');
      if (!d) {
        d = 'DEV_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
        localStorage.setItem('TEACHER_DEV_UUID', d);
      }
      return d;
    }

    let curId = null;

    function liveTime() {
      const now = new Date();
      document.getElementById('clockBox').innerText = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(liveTime, 1000);
    liveTime();

    window.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem('MY_SAVED_TEACHER_ID');
      if (savedId && TEACHERS[savedId]) {
        curId = savedId;
        showDashboard(savedId, TEACHERS[savedId]);
      }
    });

    function bindTeacher() {
      const id = document.getElementById('inputId').value.trim();
      if (!id) return alert('الرجاء إدخال رقم الهوية');
      if (!TEACHERS[id]) return alert('رقم الهوية غير مسجل في النظام');

      localStorage.setItem('MY_SAVED_TEACHER_ID', id);
      curId = id;
      showDashboard(id, TEACHERS[id]);

      // إرسال الربط للسيرفر
      sendToServer('verify', id, '');
    }

    function showDashboard(id, name) {
      document.getElementById('boxInput').classList.add('hidden');
      document.getElementById('boxAction').classList.remove('hidden');
      document.getElementById('subTitle').innerText = 'تم ربط هذا الجهاز بحسابك';
      document.getElementById('tName').innerText = name;
      document.getElementById('tId').innerText = 'السجل المدني: ' + id;
    }

    function sendToServer(action, id, type) {
      document.getElementById('f_action').value = action;
      document.getElementById('f_id').value = id;
      document.getElementById('f_type').value = type;
      document.getElementById('f_dev').value = getUUID();
      document.getElementById('attendanceForm').submit();
    }

    function recordTime(type) {
      if (!curId) return;
      const btn = type === 'CHECK_IN' ? document.getElementById('btnIn') : document.getElementById('btnOut');
      const oldTxt = btn.innerText;
      btn.innerText = 'جاري التسجيل في الشيت...';
      btn.disabled = true;

      const now = new Date();
      const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

      // إرسال يكتب فوراً في Google Sheet
      sendToServer('record', curId, type);

      setTimeout(() => {
        btn.innerText = oldTxt;
        btn.disabled = false;
        const box = document.getElementById('msgBox');
        box.classList.remove('hidden');
        box.className = "p-3.5 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-900 border border-emerald-300";
        box.innerText = (type === 'CHECK_IN' ? 'تم تسجيل حضورك بنجاح' : 'تم تسجيل انصرافك بنجاح') + ' - الساعة ' + timeStr;
      }, 700);
    }
  </script>
</body>
</html>
